[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-intelligence-agent"
version = "0.1.0"
description = "Read-only storage estate intelligence pilot"
requires-python = ">=3.13"
dependencies = [
  "a2a-sdk[fastapi]==1.1.2",
  "azure-ai-projects==2.0.0b2",
  "azure-communication-email==1.1.0",
  "azure-cosmos==4.9.0",
  "azure-functions==1.24.0",
  "azure-functions-durable==1.4.0",
  "azure-identity==1.24.0",
  "croniter==6.2.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mcp==2.0.0",
  "openai==2.53.0",
  "openpyxl==3.1.5",
  "pydantic==2.12.5",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
connectors = [
  "azure-mgmt-costmanagement==4.0.1",
  "azure-mgmt-resourcegraph==8.0.0",
  "azure-monitor-querymetrics==1.0.0",
  "azure-storage-file-datalake==12.21.0",
  "pyarrow==21.0.0",
]
test = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = ["*.md", "*.json"]

[project.scripts]
storage-intelligence-mcp = "protocols.mcp_server:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
