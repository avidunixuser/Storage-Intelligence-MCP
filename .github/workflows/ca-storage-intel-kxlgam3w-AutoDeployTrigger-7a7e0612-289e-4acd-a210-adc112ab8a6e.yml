name: Trigger auto deployment for ca-storage-intel-kxlgam3w

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-storage-intel-kxlgam3w-AutoDeployTrigger-7a7e0612-289e-4acd-a210-adc112ab8a6e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CASTORAGEINTELKXLGAM3W_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CASTORAGEINTELKXLGAM3W_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CASTORAGEINTELKXLGAM3W_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrlgvr.azurecr.io
          registryUsername: ${{ secrets.CASTORAGEINTELKXLGAM3W_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CASTORAGEINTELKXLGAM3W_REGISTRY_PASSWORD }}
          containerAppName: ca-storage-intel-kxlgam3w
          resourceGroup: rg-storage-intel-mcpa2a
          imageToBuild: acrlgvr.azurecr.io/ca-storage-intel-kxlgam3w:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


