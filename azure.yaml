# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: storage-intelligence-agent
metadata:
  template: storage-intelligence-agent@0.1.0
infra:
  provider: bicep
  path: infra
  module: main
services:
  tools:
    project: src
    language: python
    host: function
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/preprovision.ps1
    posix:
      shell: sh
      run: ./scripts/preprovision.sh
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/postdeploy.ps1
    posix:
      shell: sh
      run: ./scripts/postdeploy.sh
